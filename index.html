<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Frutas y Verduras Garcia Martin</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body { font-family: Arial; padding: 20px; }
    input { width: 60px; margin: 5px; }
    button { padding: 10px; margin-top: 10px; }
  </style>
</head>

<body>

<h1>🍅 Frutas y Verduras Garcia Martin</h1>

<div id="login">
  <input id="user" placeholder="Usuario">
  <button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none;"></div>

<script>

let pedido = {};
let unidadesSeleccionadas = {};

function login() {
  const user = document.getElementById("user").value;
  document.getElementById("login").style.display = "none";

  if (user === "silvia70" || user === "jose63") {
    adminPanel();
  } else {
    clientePanel();
  }
}

function clientePanel() {
  const app = document.getElementById("app");
  app.style.display = "block";

 const productos = [
  "Tomate pera",
  "Patata agria",
  "Lechuga",
  "Cebolla",
  "Calabacín",
  "Pimiento rojo",
  "Zanahoria",
  "Albahaca",
  "Perejil",
  "Plátano",
  "Manzana"
];

  let html = "<h2>Hacer pedido</h2>";

  productos.forEach(p => {

  html += `
    <div style="margin-bottom:8px;">
      ${p}
      <select onchange="setUnidad('${p}', this.value)">
        <option value="kg">kg</option>
        <option value="unidad">unidad</option>
        <option value="manojo">manojo</option>
      </select>
      <input type="number" min="0" placeholder="0" onchange="add('${p}', this.value)">
    </div>
  `;
});

  html += `
    <h3>Pedido</h3>
    <div id="pedido"></div>
    <button onclick="enviar()">Enviar pedido</button>
  `;

  app.innerHTML = html;
}

function add(producto, cantidad) {
  if (cantidad > 0) {
    pedido[producto] = {
      cantidad: cantidad,
      unidad: unidadesSeleccionadas[producto] || "kg"
    };
  } else {
    delete pedido[producto];
  }

  mostrarPedido();
}

function mostrarPedido() {
  let texto = "";

  for (let p in pedido) {
    texto += `${p}: ${pedido[p]}<br>`;
  }

  document.getElementById("pedido").innerHTML = texto;
}

function enviar() {
  alert("Pedido enviado (simulación)");
  pedido = {};
  location.reload();
}

function adminPanel() {
  const app = document.getElementById("app");
  app.style.display = "block";

  app.innerHTML = `
    <h2>Panel Administrador</h2>

    <h3>Pedidos hoy</h3>
    <ul>
      <li>🔴 GO NYAN AQUA</li>
      <li>🟡 CINES BABEL</li>
      <li>🟢 HORNO ROSALEN</li>
    </ul>

    <h3>Preparación</h3>
    <p>Tomate → 82kg</p>
    <p>Patata → 110kg</p>

    <h3>Reparto</h3>
    <p>Centro → Juan</p>
    <p>Afueras → Pedro</p>

    <h3>Cobros</h3>
    <p>💵 120€ | 💳 80€</p>
  `;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

</script>

</body>
</html>
