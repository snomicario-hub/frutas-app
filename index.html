<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Frutas y Verduras Garcia Martin</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body { font-family: Arial; padding: 20px; }
    input, select { margin: 5px; }
    .producto { margin-bottom: 6px; }
  </style>
</head>

<body>

<h1>🍅 Frutas y Verduras Garcia Martin</h1>

<div id="login">
  <input id="user" placeholder="Usuario">
  <button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none;"></div>

<script>

let pedido = {};
let unidadesSeleccionadas = {};
let favoritos = [];

// LOGIN
function login() {
  const user = document.getElementById("user").value;

  if (!user) {
    alert("Introduce usuario");
    return;
  }

  document.getElementById("login").style.display = "none";

  if (user === "silvia70" || user === "jose63") {
    adminPanel();
  } else {
    clientePanel();
  }
}

// CLIENTE
function clientePanel() {
  const app = document.getElementById("app");
  app.style.display = "block";

  const productos = [
    { nombre: "Tomate pera", categoria: "VERDURAS" },
    { nombre: "Patata agria", categoria: "VERDURAS" },
    { nombre: "Lechuga", categoria: "VERDURAS" },
    { nombre: "Cebolla", categoria: "VERDURAS" },
    { nombre: "Plátano", categoria: "FRUTAS" },
    { nombre: "Manzana", categoria: "FRUTAS" },
    { nombre: "Albahaca", categoria: "HIERBAS" }
  ];

  let html = `
    <h2>Hacer pedido</h2>
    <button onclick="verFavoritos()">⭐ Ver favoritos</button>
    <input type="text" placeholder="Buscar..." onkeyup="filtrar(this.value)">
  `;

  const categorias = ["VERDURAS", "FRUTAS", "HIERBAS"];

  categorias.forEach(cat => {
    html += `<h3>${cat}</h3>`;

    productos
      .filter(p => p.categoria === cat)
      .sort((a, b) => a.nombre.localeCompare(b.nombre))
      .forEach(p => {

        html += `
          <div class="producto" data-nombre="${p.nombre.toLowerCase()}">
            ⭐ <span onclick="toggleFavorito('${p.nombre}')">${p.nombre}</span>
            <select onchange="setUnidad('${p.nombre}', this.value)">
              <option value="kg">kg</option>
              <option value="unidad">unidad</option>
              <option value="manojo">manojo</option>
            </select>
            <input type="number" min="0" onchange="add('${p.nombre}', this.value)">
          </div>
        `;
      });
  });

  html += `<h3>Pedido</h3><div id="pedido"></div>`;

  app.innerHTML = html;
}

// ADMIN
function adminPanel() {
  const app = document.getElementById("app");
  app.style.display = "block";

  app.innerHTML = `
    <h2>Panel Administrador</h2>
    <p>Pedidos hoy: 3</p>
  `;
}

// FAVORITOS
function toggleFavorito(producto) {
  if (favoritos.includes(producto)) {
    favoritos = favoritos.filter(p => p !== producto);
  } else {
    favoritos.push(producto);
  }

  alert("Favoritos actualizados");
}

function verFavoritos() {
  let texto = "Favoritos:\n";

  favoritos.forEach(f => {
    texto += f + "\n";
  });

  alert(texto);
}

// PEDIDOS
function setUnidad(producto, unidad) {
  unidadesSeleccionadas[producto] = unidad;
}

function add(producto, cantidad) {
  if (cantidad > 0) {
    pedido[producto] = {
      cantidad: cantidad,
      unidad: unidadesSeleccionadas[producto] || "kg"
    };
  } else {
    delete pedido[producto];
  }

  mostrarPedido();
}

function mostrarPedido() {
  let texto = "";

  for (let p in pedido) {
    texto += `${p}: ${pedido[p].cantidad} ${pedido[p].unidad}<br>`;
  }

  document.getElementById("pedido").innerHTML = texto;
}

// BUSCADOR
function filtrar(texto) {
  texto = texto.toLowerCase();

  document.querySelectorAll(".producto").forEach(p => {
    const nombre = p.dataset.nombre;
    p.style.display = nombre.includes(texto) ? "block" : "none";
  });
}

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

</script>

</body>
</html>
